name: Portable Operational CLI Patch

on:
  pull_request:
    paths:
      - ".github/workflows/portable-operational-cli-patch.yml"

permissions:
  contents: write

jobs:
  patch-cli:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply packaged CLI corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/investigation_world/world_portability.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "import argparse\nimport asyncio\nfrom copy import deepcopy\nimport json\nfrom pathlib import Path\nimport sys\nfrom typing import Any, Mapping, Sequence\n",
                  "import argparse\nimport asyncio\nimport json\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom typing import Any, Mapping, Sequence\n",
              ),
              (
                  "            result = {\n                \"adapter\": \"nemo\",\n",
                  "            result: dict[str, Any] = {\n                \"adapter\": \"nemo\",\n",
              ),
              (
                  "            built = build_hud_operational_export(contract, output)\n",
                  "            hud_built = build_hud_operational_export(contract, output)\n",
              ),
              (
                  "                \"output_dir\": built.output_dir,\n                \"public_contract_id\": built.public_contract_id,\n                \"public_package_id\": built.public_package_id,\n                \"export_id\": built.export_id,\n",
                  "                \"output_dir\": hud_built.output_dir,\n                \"public_contract_id\": hud_built.public_contract_id,\n                \"public_package_id\": hud_built.public_package_id,\n                \"export_id\": hud_built.export_id,\n",
              ),
              (
                  "            built = build_prime_operational_package(\n",
                  "            prime_built = build_prime_operational_package(\n",
              ),
              (
                  "                \"output_dir\": built.output_dir,\n                \"public_contract_id\": contract.public.public_id,\n                \"package_id\": built.package_id,\n                \"export_id\": built.export_id,\n",
                  "                \"output_dir\": prime_built.output_dir,\n                \"public_contract_id\": contract.public.public_id,\n                \"package_id\": prime_built.package_id,\n                \"export_id\": prime_built.export_id,\n",
              ),
              (
                  "            built = export_harbor_package(contract, output, config)\n",
                  "            harbor_built = export_harbor_package(contract, output, config)\n",
              ),
              (
                  "                \"output_dir\": built.output_dir,\n                \"public_contract_id\": built.public_contract_id,\n                \"package_id\": built.package_id,\n                \"mcp_surface_id\": built.mcp_surface_id,\n",
                  "                \"output_dir\": harbor_built.output_dir,\n                \"public_contract_id\": harbor_built.public_contract_id,\n                \"package_id\": harbor_built.package_id,\n                \"mcp_surface_id\": harbor_built.mcp_surface_id,\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement, got {count}: {old[:60]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" ruff mypy
          ruff check src/investigation_world/world_portability.py
          mypy --follow-imports=skip src/investigation_world/world_portability.py
          python -m compileall -q src/investigation_world/world_portability.py
          python -m pytest -q tests/tools/world_portability_test.py
          test "$(git diff --name-only)" = "src/investigation_world/world_portability.py"
          git diff --check
      - name: Commit correction and remove one-shot workflow
        run: |
          rm .github/workflows/portable-operational-cli-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/investigation_world/world_portability.py .github/workflows/portable-operational-cli-patch.yml
          git commit -m "Fix packaged portability CLI quality defects"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
