name: Investigation Data Quality Debug

on:
  push:
    branches:
      - feat/high-stakes-investigation-data

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-quality.txt
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-quality.txt
      - name: Print investigation-data diagnostics
        run: |
          python -m ruff check src/investigation_world/investigation_data tests/investigation_data
          python -m mypy src/investigation_world/investigation_data --no-incremental --show-error-codes --show-column-numbers --no-pretty
