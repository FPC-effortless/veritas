name: Lifecycle preflight controls

on:
  pull_request:
    paths:
      - 'src/investigation_world/benchmark/lifecycle_observability.py'
      - 'integrations/forge/**'
      - 'integrations/trainlab/**'
      - 'integrations/research_lab/src/**'
      - 'tests/unit/test_lifecycle_*.py'
      - '.github/workflows/lifecycle-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ecosystem packages
        run: python -m pip install '.[test]' ./integrations/forge ./integrations/trainlab ./integrations/research_lab
      - name: Check observability and guarded dispatch without model fitting
        run: python -m pytest tests/unit/test_lifecycle_observability.py tests/unit/test_lifecycle_preflight.py -q
      - name: Check refusals with Python assertions disabled
        run: python -O -m pytest tests/unit/test_lifecycle_preflight.py -q
