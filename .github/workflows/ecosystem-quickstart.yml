name: Ecosystem clean-install quickstart

on:
  pull_request:
    paths:
      - 'src/investigation_world/**'
      - 'integrations/forge/**'
      - 'integrations/trainlab/**'
      - 'integrations/research_lab/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'tools/ecosystem_install_smoke.py'
      - 'tests/unit/test_ecosystem_quickstart.py'
      - '.github/workflows/ecosystem-quickstart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheels, inspect licenses, install in isolation, compare and reverify
        run: python tools/ecosystem_install_smoke.py --output "$RUNNER_TEMP/ecosystem-acceptance"
      - name: Install sibling packages for software falsifiers
        run: python -m pip install '.[test]' ./integrations/forge ./integrations/trainlab ./integrations/research_lab
      - name: Check tampering, metadata binding, verifier controls and shared evidence
        run: python -m pytest tests/unit/test_ecosystem_quickstart.py tests/unit/test_shared_evidence_contract.py -q
      - name: Retain only public constructed acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-acceptance-python-${{ matrix.python }}
          path: ${{ runner.temp }}/ecosystem-acceptance/acceptance.json
          if-no-files-found: warn
