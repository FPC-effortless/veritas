name: Review Provenance Bootstrap

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  verify-bootstrap-candidate:
    name: Verify provenance bootstrap candidate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
       github.event.label.name == 'review-provenance-bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.target.outputs.eligible }}
    env:
      TARGET_PR: "323"
      TARGET_HEAD: b99ddb78699fbff6b90fe5b05af7f89746c75ab0
    steps:
      - name: Resolve pinned bootstrap target
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number(process.env.TARGET_PR);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            if (pr.state !== 'open' || pr.merged) {
              core.notice('bootstrap target is no longer open; workflow is inert');
              core.setOutput('eligible', 'false');
              return;
            }
            if (pr.head.sha !== process.env.TARGET_HEAD) {
              core.setFailed(`bootstrap target head moved: ${pr.head.sha}`);
              return;
            }
            if (pr.user.login === 'github-actions[bot]') {
              core.setFailed('bootstrap bot cannot review its own pull request');
              return;
            }
            core.setOutput('eligible', 'true');

      - name: Require the frozen five-path diff
        if: steps.target.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const expected = [
              '.github/workflows/security.yml',
              'AGENTS.md',
              'docs/automation/review-provenance.md',
              'tests/automation/test_review_provenance.py',
              'tools/review_provenance.py',
            ].sort();
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
              per_page: 100,
            });
            const actual = files.map((file) => file.filename).sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              core.setFailed(`unexpected changed paths: ${JSON.stringify(actual)}`);
            }

      - name: Check out the exact candidate without credentials
        if: steps.target.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false

      - name: Set up Python
        if: steps.target.outputs.eligible == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run independent provenance falsifiers
        if: steps.target.outputs.eligible == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path('tools/review_provenance.py')
          spec = importlib.util.spec_from_file_location('candidate_review_provenance', path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          head = 'b99ddb78699fbff6b90fe5b05af7f89746c75ab0'
          author = 'FPC-effortless'

          def review(state, login, review_id, commit_id=head, submitted_at='2026-08-31T06:45:26Z'):
              return {
                  'state': state,
                  'commit_id': commit_id,
                  'user': {'login': login},
                  'id': review_id,
                  'submitted_at': submitted_at,
              }

          decision = module.evaluate_reviews(
              pr_author=author,
              head_sha=head,
              reviews=[review('APPROVED', author, 1)],
          )
          assert not decision.ok and 'same-account' in decision.reason

          decision = module.evaluate_reviews(
              pr_author=author,
              head_sha=head,
              reviews=[review('COMMENTED', author, 2)],
          )
          assert not decision.ok

          decision = module.evaluate_reviews(
              pr_author=author,
              head_sha=head,
              reviews=[review('APPROVED', 'independent-reviewer', 3)],
          )
          assert decision.ok and decision.reviewer == 'independent-reviewer'

          stale = '0' * 40
          decision = module.evaluate_reviews(
              pr_author=author,
              head_sha=head,
              reviews=[review('APPROVED', 'independent-reviewer', 4, commit_id=stale)],
          )
          assert not decision.ok

          decision = module.evaluate_reviews(
              pr_author=author,
              head_sha=head,
              reviews=[
                  review('APPROVED', 'independent-reviewer', 5, submitted_at='2026-08-31T06:40:00Z'),
                  review('CHANGES_REQUESTED', 'independent-reviewer', 6, submitted_at='2026-08-31T06:41:00Z'),
              ],
          )
          assert not decision.ok and 'changes requested' in decision.reason

          malformed = review('APPROVED', 'independent-reviewer', 7)
          malformed['id'] = 0
          try:
              module.evaluate_reviews(pr_author=author, head_sha=head, reviews=[malformed])
          except module.ProvenanceError:
              pass
          else:
              raise AssertionError('malformed decisive review did not fail closed')
          PY

      - name: Verify security workflow placement and refresh routing
        if: steps.target.outputs.eligible == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/security.yml').read_text(encoding='utf-8')
          assert 'pull_request_review:' in text
          assert 'Refresh PR-head security after review' in text
          assert text.count('Require independent exact-head review') == 2
          assert text.count('python tools/review_provenance.py check') == 1
          assert text.count('python3 tools/review_provenance.py check') == 1
          assert text.index('Run Bandit on application code') < text.index('Require independent exact-head review')
          node_audit = text.index('Audit critical vulnerabilities')
          second_review = text.rindex('Require independent exact-head review')
          assert node_audit < second_review
          PY

      - name: Run candidate regression suite
        if: steps.target.outputs.eligible == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/automation/test_review_provenance.py

  approve-bootstrap-candidate:
    name: Approve exact bootstrap candidate
    needs: verify-bootstrap-candidate
    if: >-
      needs.verify-bootstrap-candidate.result == 'success' &&
      needs.verify-bootstrap-candidate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      TARGET_PR: "323"
      TARGET_HEAD: b99ddb78699fbff6b90fe5b05af7f89746c75ab0
    steps:
      - name: Submit machine-isolated exact-head approval
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number(process.env.TARGET_PR);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            if (pr.state !== 'open' || pr.merged) {
              core.setFailed('bootstrap target is no longer open');
              return;
            }
            if (pr.head.sha !== process.env.TARGET_HEAD) {
              core.setFailed(`head moved: ${pr.head.sha}`);
              return;
            }
            if (pr.user.login === 'github-actions[bot]') {
              core.setFailed('bootstrap bot cannot review its own pull request');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              per_page: 100,
            });
            const blocking = reviews.some((review) =>
              review.commit_id === process.env.TARGET_HEAD &&
              review.state === 'CHANGES_REQUESTED'
            );
            if (blocking) {
              core.setFailed('exact-head changes-requested review exists');
              return;
            }
            const existing = reviews.some((review) =>
              review.commit_id === process.env.TARGET_HEAD &&
              review.state === 'APPROVED' &&
              review.user?.login === 'github-actions[bot]'
            );
            if (existing) {
              core.notice('exact-head bootstrap approval already exists');
              return;
            }
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              commit_id: process.env.TARGET_HEAD,
              event: 'APPROVE',
              body: [
                'Machine-isolated bootstrap approval for ROADMAP-REVIEW-PROVENANCE-002.',
                'The trusted default-branch workflow executed independent falsifiers against',
                'the exact candidate head without exposing a write token to candidate code.',
                `Exact head: ${process.env.TARGET_HEAD}`,
              ].join(' '),
            });
