name: Kaggle launch controls (CPU only)
on:
  pull_request:
    paths:
      - 'integrations/trainlab/examples/fullcycle003/**'
      - 'integrations/trainlab/tests_data/test_kaggle_launcher.py'
      - '.github/workflows/kaggle-launch-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook/schema and data-contract helpers only
        run: python -m pip install -e integrations/forge -e integrations/trainlab 'nbformat>=5.10,<6'
      - name: Exercise standard Linux process ownership and shutdown
        run: |
          python -c 'import os,pathlib; assert int(pathlib.Path("/proc/self/stat").read_text().split(" ",1)[0]) == os.getpid(), "process fixtures must run, not skip"'
          python -m unittest discover -s integrations/trainlab/tests_data -p test_kaggle_launcher.py -v
