name: Model Calibration Bounded Strong

on:
  push:
    branches:
      - feature/bounded-strong-calibration
    paths:
      - "src/investigation_world/calibration/bounded.py"
      - "tools/run_bounded_model_calibration.py"
      - ".github/workflows/model-calibration-bounded-strong.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-calibration-bounded-strong-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qwen3b:
    name: qwen2.5-3b-bounded
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-qwen2.5-3b-v1
      - name: Install Veritas
        run: python -m pip install -e ".[test]"
      - name: Install CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "transformers>=4.46,<5" "accelerate>=1,<2" sentencepiece
      - name: Run bounded calibration
        run: |
          python tools/run_bounded_model_calibration.py \
            --model Qwen/Qwen2.5-3B-Instruct \
            --output calibration-results/qwen2.5-3b-bounded.json \
            --episodes-per-level 2 \
            --max-new-tokens 128 \
            --max-input-tokens 4096 \
            --dtype bfloat16
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-qwen2.5-3b-bounded
          path: calibration-results/qwen2.5-3b-bounded.json
          if-no-files-found: error
          retention-days: 30

  phi35:
    name: phi3.5-mini-bounded
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-phi3.5-mini-v1
      - name: Install Veritas
        run: python -m pip install -e ".[test]"
      - name: Install Microsoft-compatible Phi runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.3.1"
          python -m pip install "transformers==4.43.0" "accelerate==0.31.0" sentencepiece
      - name: Run bounded calibration
        run: |
          python tools/run_bounded_model_calibration.py \
            --model microsoft/Phi-3.5-mini-instruct \
            --output calibration-results/phi3.5-mini-bounded.json \
            --episodes-per-level 2 \
            --max-new-tokens 128 \
            --max-input-tokens 4096 \
            --dtype bfloat16 \
            --trust-remote-code
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-phi3.5-mini-bounded
          path: calibration-results/phi3.5-mini-bounded.json
          if-no-files-found: error
          retention-days: 30
