name: Model Calibration

on:
  pull_request:
    paths:
      - "src/investigation_world/calibration/**"
      - "src/investigation_world/training_value/**"
      - "tools/run_model_calibration.py"
      - "tools/run_noise_ablation.py"
      - "tools/run_training_value_v2.py"
      - "tools/build_customer_evaluation_report.py"
      - ".github/workflows/model-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: smollm2-135m
            model: HuggingFaceTB/SmolLM2-135M-Instruct
          - slug: smollm2-360m
            model: HuggingFaceTB/SmolLM2-360M-Instruct
          - slug: qwen2.5-0.5b
            model: Qwen/Qwen2.5-0.5B-Instruct
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-${{ matrix.slug }}-v1
      - name: Install Veritas
        run: python -m pip install -e ".[test]"
      - name: Install CPU model runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "transformers>=4.46,<5" "accelerate>=1,<2" sentencepiece
      - name: Run calibration
        run: |
          python tools/run_model_calibration.py \
            --model "${{ matrix.model }}" \
            --output "calibration-results/${{ matrix.slug }}.json" \
            --max-new-tokens 256 \
            --max-input-tokens 7168
      - name: Upload calibration result
        uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ matrix.slug }}
          path: calibration-results/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 30

  noise-ablation:
    name: qwen0.5b-noise-conflict
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-qwen2.5-0.5b-v1
      - name: Install Veritas and model runtime
        run: |
          python -m pip install -e ".[test]"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "transformers>=4.46,<5" "accelerate>=1,<2" sentencepiece
      - name: Verify ablation invariants
        run: python -m pytest tests/unit/test_noise_ablation.py -q
      - name: Run noise/conflict ablation
        run: |
          python tools/run_noise_ablation.py \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --output ablation-results/qwen2.5-0.5b-noise-conflict.json \
            --distractors 6 \
            --max-new-tokens 256 \
            --max-input-tokens 7168
      - uses: actions/upload-artifact@v4
        with:
          name: ablation-qwen0.5b-noise-conflict
          path: ablation-results/qwen2.5-0.5b-noise-conflict.json
          if-no-files-found: error
          retention-days: 30

  training-value-v2:
    name: qwen0.5b-training-value-v2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-qwen2.5-0.5b-training-v2-v1
      - name: Install Veritas and training runtime
        run: |
          python -m pip install -e ".[test]"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "transformers>=4.46,<5" "accelerate>=1,<2" "peft>=0.13,<1" sentencepiece
      - name: Verify training-value invariants
        run: python -m pytest tests/unit/test_training_value.py -q
      - name: Run training-value v2
        run: |
          python tools/run_training_value_v2.py \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --output training-results/qwen2.5-0.5b-training-v2.json \
            --train-examples 12 \
            --heldout-examples 12 \
            --epochs 3 \
            --learning-rate 0.0005 \
            --max-length 1536 \
            --max-new-tokens 192
      - uses: actions/upload-artifact@v4
        with:
          name: training-value-v2-qwen0.5b
          path: training-results/qwen2.5-0.5b-training-v2.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate-evidence
    needs: calibrate
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Veritas
        run: python -m pip install -e ".[test]"
      - name: Download completed calibration artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: calibration-*
          path: calibration-results
          merge-multiple: true
      - name: Build comparative benchmark report
        shell: bash
        run: |
          shopt -s nullglob
          files=(calibration-results/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No completed calibration JSON files were produced." >&2
            exit 1
          fi
          python tools/build_customer_evaluation_report.py \
            "${files[@]}" \
            --output calibration-results/REPORT.md \
            --title "Veritas CompanyWorld v0.1 Baseline Evidence" \
            --benchmark-version "CompanyWorld-v0.1"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('calibration-results')
          entries = []
          for path in sorted(root.glob('*.json')):
              data = path.read_bytes()
              entries.append({
                  'file': path.name,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'bytes': len(data),
              })
          manifest = {
              'schema_version': '0.1.0',
              'benchmark_version': 'CompanyWorld-v0.1',
              'source_commit': '${{ github.sha }}',
              'workflow_run_id': '${{ github.run_id }}',
              'artifacts': entries,
          }
          (root / 'EVIDENCE_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: companyworld-v0.1-evidence
          path: calibration-results/
          if-no-files-found: error
          retention-days: 30
