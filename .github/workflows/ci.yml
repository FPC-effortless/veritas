name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Run test suite
        run: python -m pytest tests/

  python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  environment-smoke:
    name: Environment smoke test
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Exercise world → evidence → tasks → search pipeline
        run: |
          python -m investigation_world.cli generate-world --seed 42 --output /tmp/world.json
          python -m investigation_world.cli render-evidence /tmp/world.json --output /tmp/evidence.json --seed 42
          python -m investigation_world.cli generate-tasks /tmp/evidence.json --output /tmp/tasks.json --oracle-output /tmp/oracles.json --count 48 --seed 42
          python -m investigation_world.cli build-index /tmp/evidence.json --database /tmp/search.sqlite
          test -s /tmp/world.json
          test -s /tmp/evidence.json
          test -s /tmp/tasks.json
          test -s /tmp/oracles.json
          test -s /tmp/search.sqlite
      - name: Exercise unified Veritas operational product
        run: |
          veritas capabilities
          veritas domains
          veritas build-world financial_spreadsheet --seed 42 --output /tmp/finance_world.json --oracle-output /tmp/finance_oracle.json
          veritas build-suite --seed 42 --output /tmp/operational_suite.json --oracle-output /tmp/operational_oracles.json
          veritas build-company --organization-id ORG-CI-001 --seed 42 --output /tmp/veritas_company.json
          test -s /tmp/finance_world.json
          test -s /tmp/finance_oracle.json
          test -s /tmp/operational_suite.json
          test -s /tmp/operational_oracles.json
          test -s /tmp/veritas_company.json

  operational-production-scale:
    name: Production-scale operational distribution
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile and validate 4,480 executable operational episodes
        run: veritas validate-production-scale --seed 42

  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm build

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: [python-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: veritas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot container and verify API health
        run: |
          docker run -d --rm --name veritas-ci -p 8000:8000 veritas:ci
          trap 'docker rm -f veritas-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' veritas-ci 2>/dev/null | grep -q true; then
              echo "Container exited before becoming healthy"
              docker logs veritas-ci || true
              exit 1
            fi
            sleep 1
          done
          echo "API did not become healthy within 30 seconds"
          docker logs veritas-ci || true
          exit 1

  required:
    name: Required
    if: always()
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - python-package
      - environment-smoke
      - operational-production-scale
      - frontend
      - container-build
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'
