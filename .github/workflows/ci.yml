name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Run test suite
        run: python -m pytest tests/

  python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  environment-smoke:
    name: Environment smoke test
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Exercise world → evidence → tasks → search pipeline
        run: |
          python -m investigation_world.cli generate-world --seed 42 --output /tmp/world.json
          python -m investigation_world.cli render-evidence /tmp/world.json --output /tmp/evidence.json --seed 42
          python -m investigation_world.cli generate-tasks /tmp/evidence.json --output /tmp/tasks.json --oracle-output /tmp/oracles.json --count 48 --seed 42
          python -m investigation_world.cli build-index /tmp/evidence.json --database /tmp/search.sqlite
          test -s /tmp/world.json
          test -s /tmp/evidence.json
          test -s /tmp/tasks.json
          test -s /tmp/oracles.json
          test -s /tmp/search.sqlite
      - name: Exercise unified Veritas operational product
        run: |
          veritas capabilities
          veritas domains
          veritas build-world financial_spreadsheet --seed 42 --output /tmp/finance_world.json --oracle-output /tmp/finance_oracle.json
          veritas build-suite --seed 42 --output /tmp/operational_suite.json --oracle-output /tmp/operational_oracles.json
          veritas materialize-native financial_spreadsheet --seed 42 --output-dir /tmp/native_finance
          veritas build-company --organization-id ORG-CI-001 --seed 42 --output /tmp/veritas_company.json
          test -s /tmp/finance_world.json
          test -s /tmp/finance_oracle.json
          test -s /tmp/operational_suite.json
          test -s /tmp/operational_oracles.json
          test -s /tmp/native_finance/financial_model.xlsx
          test -s /tmp/veritas_company.json

  operational-production-scale:
    name: Production-scale operational distribution
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile and validate 4,480 executable operational episodes
        run: veritas validate-production-scale --seed 42

  native-artifact-fidelity:
    name: Native artifact fidelity
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Materialize and verify all domain × split native artifact cells
        run: veritas validate-native-fidelity --seed 42 --cases-per-split 8

  projectworld-production-scale:
    name: Production-scale ProjectWorld distribution
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile and validate 896 long-horizon construction projects
        run: |
          python - <<'PY'
          from investigation_world.projectworld import (
              ProjectDistributionConfig,
              compile_project_distribution,
              project_distribution_manifest,
              validate_project_distribution,
          )

          config = ProjectDistributionConfig(seed=42)
          cases = compile_project_distribution(config)
          validation = validate_project_distribution(cases, config=config)
          assert validation["valid"], validation["errors"]
          assert len(cases) == 896
          manifest = project_distribution_manifest(cases, config=config)
          assert manifest.public_hash
          assert manifest.private_hash
          print(manifest.model_dump_json(indent=2))
          PY

  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm build

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: [python-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build container without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: veritas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot container and verify API health
        run: |
          docker run -d --rm --name veritas-ci -p 8000:8000 veritas:ci
          trap 'docker rm -f veritas-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' veritas-ci 2>/dev/null | grep -q true; then
              echo "Container exited before becoming healthy"
              docker logs veritas-ci || true
              exit 1
            fi
            sleep 1
          done
          echo "API did not become healthy within 30 seconds"
          docker logs veritas-ci || true
          exit 1

  semantic-isolated-execution:
    name: Semantic isolated execution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Explain non-PR execution boundary
        if: github.event_name != 'pull_request'
        run: echo "Semantic isolated execution is a pull-request-only candidate gate."

      - name: Check out trusted base without persisted credentials
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false

      - name: Check out exact candidate without persisted credentials
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Build trusted dependency image from base
        if: github.event_name == 'pull_request'
        run: |
          cat > "$RUNNER_TEMP/semantic-review.Dockerfile" <<'EOF'
          FROM node:22-bookworm-slim AS node-runtime
          FROM python:3.12-slim
          COPY --from=node-runtime /usr/local/bin/node /usr/local/bin/node
          ENV PIP_DISABLE_PIP_VERSION_CHECK=1 \
              PYTHONDONTWRITEBYTECODE=1
          WORKDIR /baseline
          COPY . /baseline
          RUN node --version && \
              python -m pip install --no-cache-dir --upgrade pip && \
              python -m pip install --no-cache-dir -e ".[test]"
          ENTRYPOINT []
          EOF
          docker build --pull \
            --file "$RUNNER_TEMP/semantic-review.Dockerfile" \
            --tag veritas-semantic-review:trusted-base \
            trusted-base

      - name: Execute exact candidate in no-network constrained container
        if: github.event_name == 'pull_request'
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: |
          set +e
          timeout --signal=KILL 15m docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 3g \
            --cpus 2 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1536m,mode=1777 \
            --tmpfs /home/reviewer:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount type=bind,src="$CANDIDATE_DIR",dst=/candidate,readonly \
            --env HOME=/home/reviewer \
            --env PYTHONDONTWRITEBYTECODE=1 \
            veritas-semantic-review:trusted-base \
            sh -lc '
              cp -a /candidate/. /tmp/work &&
              cd /tmp/work &&
              export PYTHONPATH=/tmp/work/src &&
              export PYTHONPYCACHEPREFIX=/tmp/pycache &&
              python -m compileall -q src &&
              python -m pytest -q -p no:cacheprovider tests/
            ' > "$RUNNER_TEMP/semantic-isolated.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Semantic isolated execution failed with status $status"
            tail -c 20000 "$RUNNER_TEMP/semantic-isolated.log" || true
            exit "$status"
          fi
          tail -c 20000 "$RUNNER_TEMP/semantic-isolated.log" || true

  required:
    name: Required
    if: always()
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - python-package
      - environment-smoke
      - operational-production-scale
      - native-artifact-fidelity
      - projectworld-production-scale
      - frontend
      - container-build
      - semantic-isolated-execution
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'