name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Run test suite
        run: python -m pytest tests/

  python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  environment-smoke:
    name: Environment smoke test
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Exercise world → evidence → tasks → search pipeline
        run: |
          python -m investigation_world.cli generate-world --seed 42 --output /tmp/world.json
          python -m investigation_world.cli render-evidence /tmp/world.json --output /tmp/evidence.json --seed 42
          python -m investigation_world.cli generate-tasks WORLD-000042 --output /tmp/tasks.json --count 48 --seed 42
          python -m investigation_world.cli build-index /tmp/evidence.json --database /tmp/search.sqlite
          test -s /tmp/world.json
          test -s /tmp/evidence.json
          test -s /tmp/tasks.json
          test -s /tmp/search.sqlite

  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm build

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: [python-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: veritas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  required:
    name: Required
    if: always()
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - python-package
      - environment-smoke
      - frontend
      - container-build
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'
