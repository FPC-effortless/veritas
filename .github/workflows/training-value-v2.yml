name: Training Value v2

on:
  push:
    branches:
      - feature/evidence-currency
    paths:
      - ".github/workflows/training-value-v2.yml"
      - "tools/run_training_value_v2.py"
      - "src/investigation_world/training_value/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-value-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qwen-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-qwen2.5-0.5b-training-v2-v1

      - name: Install Veritas
        run: python -m pip install -e ".[test]"

      - name: Install CPU training runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "transformers>=4.46,<5" "accelerate>=1,<2" "peft>=0.13,<1" sentencepiece

      - name: Run training-value v2
        run: |
          python tools/run_training_value_v2.py \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --output training-results/qwen2.5-0.5b-training-v2.json \
            --train-examples 12 \
            --heldout-examples 12 \
            --epochs 3 \
            --learning-rate 0.0005 \
            --max-length 1536 \
            --max-new-tokens 192

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: training-value-v2-qwen0.5b
          path: training-results/qwen2.5-0.5b-training-v2.json
          if-no-files-found: error
          retention-days: 30
