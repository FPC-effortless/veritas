name: Model Calibration Medium

on:
  push:
    branches:
      - feature/model-calibration-medium
    paths:
      - ".github/workflows/model-calibration-medium.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-calibration-medium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: qwen2.5-1.5b
            model: Qwen/Qwen2.5-1.5B-Instruct
          - slug: smollm2-1.7b
            model: HuggingFaceTB/SmolLM2-1.7B-Instruct
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-${{ matrix.slug }}-v1

      - name: Install Veritas
        run: python -m pip install -e ".[test]"

      - name: Install CPU model runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "transformers>=4.46,<5" "accelerate>=1,<2" sentencepiece

      - name: Run calibration
        run: |
          python tools/run_model_calibration.py \
            --model "${{ matrix.model }}" \
            --output "calibration-results/${{ matrix.slug }}.json" \
            --max-new-tokens 256 \
            --max-input-tokens 7168

      - name: Upload calibration result
        uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ matrix.slug }}
          path: calibration-results/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 30
