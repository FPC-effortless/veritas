name: Materialize business calibration

on:
  workflow_dispatch:
  push:
    branches: [feat/operational-world-compiler]
    paths:
      - tools/materialize_business_calibration.py
      - src/investigation_world/operational_world/external_profiles.py
      - src/investigation_world/operational_world/calibration.py
      - src/investigation_world/operational_world/models.py
      - .github/workflows/materialize-business-calibration.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Veritas and materialization dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . openpyxl
      - name: Materialize broad public business profiles
        run: |
          python tools/materialize_business_calibration.py \
            --output-dir calibration/public/business \
            --gleif-page-size 200
      - name: Validate generated profiles and acquisition states
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from investigation_world.operational_world import CalibrationProfile

          root = Path("calibration/public/business")
          manifest = json.loads((root / "manifest.json").read_text())
          files = sorted(root.glob("*-v1.json"))
          assert len(files) >= 3, files

          acquisition = {item["source_id"]: item for item in manifest["acquisition"]}
          assert acquisition["gleif_lei"]["status"] == "materialized", acquisition
          assert acquisition["online_retail_ii"]["status"] == "materialized", acquisition
          assert acquisition["sec_edgar_xbrl"]["status"] in {
              "materialized",
              "unavailable_from_runner",
          }, acquisition

          profiles = {}
          for path in files:
              profile = CalibrationProfile.model_validate_json(path.read_text())
              profiles[profile.profile_id] = profile
              assert profile.state in {"empirical", "hybrid"}, (path, profile.state)
              assert profile.distributions or profile.categories, path
              if profile.state == "empirical":
                  assert profile.empirical_observation_count > 0, path

          gleif = profiles["global-entity-gleif-v1"]
          assert gleif.size_scope == "agnostic"
          assert gleif.source_ids == ["gleif_lei"]
          retail = profiles["europe-retail-transactions-v1"]
          assert retail.industry.value == "retail"
          composite = profiles["europe-retail-medium-hybrid-v1"]
          assert composite.state == "hybrid"
          assert {"gleif_lei", "online_retail_ii"}.issubset(composite.source_ids)

          sec_state = acquisition["sec_edgar_xbrl"]["status"]
          sec_file = root / "north-america-public-company-finance-large-v1.json"
          if sec_state == "materialized":
              assert sec_file.exists()
              assert "north-america-public-company-finance-large-v1" in profiles
          else:
              assert not sec_file.exists()

          print(
              f"validated {len(files)} business profiles; SEC acquisition={sec_state}"
          )
          PY
      - name: Commit materialized profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A calibration/public/business
          if git diff --cached --quiet; then
            echo "Business calibration profiles unchanged"
            exit 0
          fi
          git commit -m "Materialize broad public business calibration profiles"
          git push origin HEAD:${{ github.ref_name }}
