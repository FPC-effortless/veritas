name: Research Lab OS

on:
  pull_request:
    paths:
      - 'integrations/research_lab/**'
      - 'integrations/trainlab/**'
      - 'integrations/forge/**'
      - '.github/workflows/research-lab-os.yml'
  push:
    paths:
      - 'integrations/research_lab/**'
      - 'integrations/trainlab/**'
      - 'integrations/forge/**'
      - '.github/workflows/research-lab-os.yml'

permissions:
  contents: read

jobs:
  local-operating-path:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONPATH: ${{ github.workspace }}/integrations/research_lab/src:${{ github.workspace }}/integrations/trainlab/src:${{ github.workspace }}/integrations/forge/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controller, role-provider contract and HTTP regressions
        run: python -m unittest discover -s integrations/research_lab/tests -v
      - name: Reused TrainLab and Forge verification
        run: |
          python -m unittest discover -s integrations/trainlab/tests -v
          python -m unittest discover -s integrations/forge/tests -v
      - name: Dashboard syntax
        run: node --check integrations/research_lab/src/research_lab/static/lab.js
      - name: Install and exercise package entrypoint
        run: |
          python -m pip install ./integrations/trainlab ./integrations/forge ./integrations/research_lab
          research-lab --root "$RUNNER_TEMP/lab-cli" status
      - name: Execute constructed CPU acceptance; zero model fits
        if: matrix.python == '3.13'
        run: python integrations/research_lab/examples/run_acceptance.py --root "$RUNNER_TEMP/labos001" --run
      - name: Browser acceptance of real research, TrainLab and Forge views
        if: matrix.python == '3.13'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python integrations/research_lab/tests/browser_smoke.py --root "$RUNNER_TEMP/labos001" --evidence "$RUNNER_TEMP/labos001/browser"
      - name: Retain constructed execution evidence
        if: always() && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: research-lab-os-constructed-evidence
          path: ${{ runner.temp }}/labos001
          if-no-files-found: error
