name: Investigation Fusion Quality Debug

on:
  push:
    branches:
      - feat/investigation-evidence-fusion

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-quality.txt
      - name: Install quality environment
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-quality.txt
      - name: Focused Ruff
        run: |
          ruff check src/investigation_world/investigation_data/fusion.py src/investigation_world/investigation_data/cli.py src/investigation_world/investigation_data/__init__.py tests/investigation_data/test_fusion.py
      - name: Focused Mypy
        if: always()
        run: |
          mypy src/investigation_world/investigation_data/fusion.py src/investigation_world/investigation_data/cli.py src/investigation_world/investigation_data/__init__.py
