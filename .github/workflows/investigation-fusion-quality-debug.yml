name: Investigation Fusion Quality Debug

on:
  push:
    branches:
      - feat/investigation-evidence-fusion

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-quality.txt
      - name: Install quality environment
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-quality.txt
      - name: Format focused fusion files
        run: |
          ruff check --fix src/investigation_world/investigation_data/fusion.py src/investigation_world/investigation_data/cli.py src/investigation_world/investigation_data/__init__.py tests/investigation_data/test_fusion.py
          ruff check src/investigation_world/investigation_data/fusion.py src/investigation_world/investigation_data/cli.py src/investigation_world/investigation_data/__init__.py tests/investigation_data/test_fusion.py
      - name: Focused Mypy
        run: |
          mypy src/investigation_world/investigation_data/fusion.py src/investigation_world/investigation_data/cli.py src/investigation_world/investigation_data/__init__.py
      - name: Commit formatting if needed
        run: |
          git config user.name "Veritas Automation"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes"
          else
            git add src/investigation_world/investigation_data/fusion.py src/investigation_world/investigation_data/cli.py src/investigation_world/investigation_data/__init__.py tests/investigation_data/test_fusion.py
            git commit -m "style(data): normalize fusion imports"
            git push origin HEAD:feat/investigation-evidence-fusion
          fi
