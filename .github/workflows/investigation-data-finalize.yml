name: Investigation Data Finalization

on:
  push:
    branches:
      - feat/high-stakes-investigation-data

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Reconcile current main
        run: |
          git config user.name "Veritas Automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Correct current NTSB download endpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("src/investigation_world/investigation_data/source_catalog.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          source = next(s for s in data["sources"] if s["source_id"] == "ntsb-aviation-census")
          artifact = next(a for a in source["artifacts"] if a["artifact_id"] == "avall-2026-08")
          artifact["url"] = "https://data.ntsb.gov/avdata/FileDirectory/DownloadFile?fileID=C%3A%5Cavdata%5Cavall.zip"
          artifact["notes"] = (
              "August 2026 release. The current NTSB directory serves avall.zip through "
              "FileDirectory/DownloadFile; the verified acquisition hash is recorded in "
              "docs/investigation_data/verified_artifacts.json. NTSB plans to transition "
              "bulk retrieval to its Enterprise API in April 2027."
          )
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Install Veritas and focused test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Validate source catalog
        run: veritas-data validate-catalog
      - name: Acquire and prepare UCDP GED 26.1
        run: |
          veritas-data acquire ucdp-ged-26.1 ged-26.1-csv --output .veritas-data --max-bytes 500000000
          UCDP_RECEIPT=.veritas-data/ucdp-ged-26.1/ged-26.1-csv/ged261-csv.zip.provenance.json
          veritas-data verify-receipt "$UCDP_RECEIPT" --root .veritas-data
          veritas-data prepare-zip "$UCDP_RECEIPT" --acquisition-root .veritas-data --output .veritas-prepared --max-uncompressed-bytes 2000000000
      - name: Acquire and prepare NTSB aviation census
        run: |
          veritas-data acquire ntsb-aviation-census avall-2026-08 --output .veritas-data --max-bytes 200000000
          NTSB_RECEIPT=.veritas-data/ntsb-aviation-census/avall-2026-08/avall.zip.provenance.json
          veritas-data verify-receipt "$NTSB_RECEIPT" --root .veritas-data
          veritas-data prepare-zip "$NTSB_RECEIPT" --acquisition-root .veritas-data --output .veritas-prepared --max-uncompressed-bytes 5000000000
      - name: Record verified artifact evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          specs = [
              ("ucdp-ged-26.1", "ged-26.1-csv", "ged261-csv.zip.provenance.json", None),
              ("ntsb-aviation-census", "avall-2026-08", "avall.zip.provenance.json", 95636276),
          ]
          artifacts = []
          for source_id, artifact_id, receipt_name, expected_bytes in specs:
              receipt_path = Path(".veritas-data") / source_id / artifact_id / receipt_name
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              if expected_bytes is not None and receipt["byte_count"] != expected_bytes:
                  raise SystemExit(
                      f"{artifact_id} byte_count changed: expected {expected_bytes}, got {receipt['byte_count']}"
                  )
              manifests = list((Path(".veritas-prepared") / source_id / artifact_id).glob("*/extraction_manifest.json"))
              if len(manifests) != 1:
                  raise SystemExit(f"expected exactly one extraction manifest for {artifact_id}, found {len(manifests)}")
              extraction = json.loads(manifests[0].read_text(encoding="utf-8"))
              artifacts.append(
                  {
                      "source_id": source_id,
                      "artifact_id": artifact_id,
                      "source_url": receipt["source_url"],
                      "resolved_url": receipt["resolved_url"],
                      "retrieved_at": receipt["retrieved_at"],
                      "sha256": receipt["sha256"],
                      "byte_count": receipt["byte_count"],
                      "content_type": receipt["content_type"],
                      "catalog_sha256": receipt["catalog_sha256"],
                      "receipt_sha256": extraction["receipt_sha256"],
                      "members": extraction["members"],
                  }
              )
          output = {
              "schema_version": "1.0",
              "verification_date": "2026-08-28",
              "purpose": "Real network acquisition and safe-extraction evidence; raw third-party archives are not committed.",
              "artifacts": artifacts,
          }
          out = Path("docs/investigation_data/verified_artifacts.json")
          out.write_text(json.dumps(output, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
      - name: Focused validation
        run: |
          python -m pytest -q tests/investigation_data
          veritas-data validate-catalog
      - name: Commit finalized evidence
        run: |
          git add src/investigation_world/investigation_data/source_catalog.json docs/investigation_data/verified_artifacts.json
          if git diff --cached --quiet; then
            echo "No finalization changes to commit"
          else
            git commit -m "data: pin real investigation acquisition evidence"
          fi
          git push origin HEAD:feat/high-stakes-investigation-data
