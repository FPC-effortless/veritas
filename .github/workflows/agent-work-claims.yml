name: Agent Work Claims

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  enroll:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.body, '<!-- veritas-agent-work -->') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enroll agent work issue
        uses: actions/github-script@v7
        with:
          script: |
            const enroll = require('./.github/scripts/agent-work-enroll.js');
            await enroll({ github, context, core });

  coordinate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, '/claim ') ||
       startsWith(github.event.comment.body, '/heartbeat ') ||
       startsWith(github.event.comment.body, '/release ') ||
       startsWith(github.event.comment.body, '/blocked ') ||
       startsWith(github.event.comment.body, '/handoff ') ||
       startsWith(github.event.comment.body, '/done ') ||
       startsWith(github.event.comment.body, '/recover ') ||
       startsWith(github.event.comment.body, '/recover-linked ') ||
       startsWith(github.event.comment.body, '/recover-metadata ') ||
       github.event.comment.body == '/roadmap-bootstrap')
    concurrency:
      group: agent-work-coordination
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply agent-work transition
        uses: actions/github-script@v7
        with:
          script: |
            const coordinate = require('./.github/scripts/agent-work-claims.js');
            await coordinate({ github, context, core });
