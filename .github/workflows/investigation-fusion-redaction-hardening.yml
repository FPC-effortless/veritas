name: Investigation Fusion Redaction Hardening

on:
  push:
    branches:
      - feat/investigation-evidence-fusion

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Enforce source redaction review
        run: |
          python - <<'PY'
          from pathlib import Path

          fusion = Path("src/investigation_world/investigation_data/fusion.py")
          text = fusion.read_text(encoding="utf-8")
          old = """    requires_review = (\n        source.rights.acquisition is AcquisitionPolicy.REVIEW_REQUIRED\n        or source.rights.ai_use is AIUsePolicy.REVIEW_REQUIRED\n    )\n"""
          new = """    requires_review = (\n        source.rights.acquisition is AcquisitionPolicy.REVIEW_REQUIRED\n        or source.rights.ai_use is AIUsePolicy.REVIEW_REQUIRED\n        or source.requires_redaction_review\n    )\n"""
          if old not in text:
              raise SystemExit("fusion review-policy block not found")
          fusion.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/investigation_data/test_fusion.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "\ndef test_external_https_host_requires_explicit_review() -> None:\n"
          addition = '''\ndef test_redaction_review_source_requires_review_id() -> None:\n    csb = fragment(\n        "csb-report",\n        source_id="uscsb",\n        locator="https://www.csb.gov/example-case/report",\n    )\n    with pytest.raises(FusionError, match="requires a rights_review_id"):\n        fuse(csb)\n\n    reviewed = csb.model_copy(update={"rights_review_id": "redaction-review-csb-1"})\n    assert fuse(reviewed).report.reviewed_fragment_ids == ("csb-report",)\n\n'''
          if "test_redaction_review_source_requires_review_id" not in test_text:
              if marker not in test_text:
                  raise SystemExit("test insertion marker not found")
              tests.write_text(test_text.replace(marker, addition + marker, 1), encoding="utf-8")

          docs = Path("docs/investigation_data/evidence_fusion.md")
          doc_text = docs.read_text(encoding="utf-8")
          old_doc = "- review-required sources without a `rights_review_id`;\n"
          new_doc = (
              "- review-required sources without a `rights_review_id`;\n"
              "- sources marked `requires_redaction_review` without a `rights_review_id`;\n"
          )
          if old_doc not in doc_text:
              raise SystemExit("documentation insertion marker not found")
          docs.write_text(doc_text.replace(old_doc, new_doc, 1), encoding="utf-8")
          PY
      - name: Install and verify focused fusion suite
        run: |
          python -m pip install -e .
          python -m pip install pytest ruff
          ruff check src/investigation_world/investigation_data/fusion.py tests/investigation_data/test_fusion.py
          python -m pytest -q tests/investigation_data/test_fusion.py
      - name: Commit hardening
        run: |
          git config user.name "Veritas Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/investigation_world/investigation_data/fusion.py tests/investigation_data/test_fusion.py docs/investigation_data/evidence_fusion.md
          git commit -m "fix(data): require redaction review during fusion"
          git push origin HEAD:feat/investigation-evidence-fusion
