name: ProjectWorld v2 Qualification

on:
  pull_request:
    paths:
      - "src/investigation_world/projectworld/v2*"
      - "src/investigation_world/qualification/projectworld.py"
      - "tools/build_projectworld_v2_qualification_candidate.py"
      - ".github/workflows/projectworld-v2-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectworld-v2-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Veritas
        run: python -m pip install -e ".[test]"

      - name: Compile 200 structural projects and execute five policy classes
        run: |
          python tools/build_projectworld_v2_qualification_candidate.py \
            --output results/projectworld-v2/qualification.json \
            --seeds-per-type 40 \
            --random-seed 7

      - name: Assert exact 18/18 qualification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/projectworld-v2/qualification.json").read_text())
          q = report["qualification"]
          gates = q["gates"]
          failed = [g["name"] for g in gates if not g["passed"]]
          if len(gates) != 18:
              raise SystemExit(f"FAIL: expected exactly 18 gates, got {len(gates)}")
          if failed:
              raise SystemExit(f"FAIL: ProjectWorld v2 is not 18/18: {failed}")
          if report["status"] != "benchmark_candidate" or not q["releaseable"]:
              raise SystemExit("FAIL: 18 passing gates did not produce a releaseable candidate")
          print(json.dumps({
              "status": report["status"],
              "candidate_id": q["candidate_id"],
              "report_id": q["report_id"],
              "panel_id": q["panel_id"],
              "gate_count": len(gates),
              "passed_gates": len(gates) - len(failed),
              "policy_means": q["policy_means"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: projectworld-v2-qualification
          path: results/projectworld-v2
          if-no-files-found: error
          retention-days: 90
