name: Security

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-refresh:
    name: Refresh PR-head security after review
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run exact PR-head Security workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["REPOSITORY"]
          head = os.environ["HEAD_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "veritas-review-refresh",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          query = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"security.yml/runs?event=pull_request&head_sha={head}&per_page=20"
          )
          with urllib.request.urlopen(
              urllib.request.Request(query, headers=headers), timeout=30
          ) as response:
              payload = json.load(response)
          runs = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == head and run.get("event") == "pull_request"
          ]
          if not runs:
              raise SystemExit("no Security pull_request run exists for exact PR head")
          run = max(runs, key=lambda item: (item.get("run_number", 0), item.get("id", 0)))
          run_id = run["id"]
          status_url = (
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}"
          )
          for _ in range(60):
              with urllib.request.urlopen(
                  urllib.request.Request(status_url, headers=headers), timeout=30
              ) as response:
                  current = json.load(response)
              if current.get("status") == "completed":
                  break
              time.sleep(2)
          else:
              raise SystemExit("PR-head Security run did not complete before refresh")
          rerun_url = f"{status_url}/rerun"
          request = urllib.request.Request(
              rerun_url,
              data=b"{}",
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {201, 202}:
                  raise SystemExit(f"unexpected Security rerun status {response.status}")
          print(f"requested Security rerun for PR head {head} via run {run_id}")
          PY

  python-dependency-audit:
    name: Python dependency audit
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pip-audit
          python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit

  python-source-security:
    name: Python source security
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run Bandit on application code
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r src -q -ll -s B101,B311
      - name: Require independent exact-head review
        # One-time migration bootstraps for reviewer-authority PRs #331, #332, and #334 only.
        # PR numbers are unique, so these exceptions are permanently inert after merge.
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.number != 331 &&
          github.event.pull_request.number != 332 &&
          github.event.pull_request.number != 334
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/review_provenance.py check \
            --repository "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --head "$HEAD_SHA"
      - name: Require clean semantic evidence when semantic review is requested
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.number != 332
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          head = os.environ["HEAD_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "veritas-semantic-security",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          providers = {
              "copilot-pull-request-reviewer[bot]",
              "chatgpt-codex-connector[bot]",
          }

          def get(path):
              url = f"https://api.github.com/repos/{repository}{path}"
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers), timeout=30
              ) as response:
                  return json.load(response)

          def get_pages(path):
              items = []
              for page in range(1, 51):
                  joiner = "&" if "?" in path else "?"
                  batch = get(f"{path}{joiner}per_page=100&page={page}")
                  if not isinstance(batch, list):
                      raise SystemExit(f"semantic evidence guard: non-list page for {path}")
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
              raise SystemExit(f"semantic evidence guard: pagination bound exceeded for {path}")

          pr = get(f"/pulls/{pr_number}")
          labels = {item.get("name") for item in pr.get("labels", [])}
          if "review-provenance-semantic" not in labels:
              print("semantic review not requested; semantic evidence guard not applicable")
              raise SystemExit(0)
          if pr.get("head", {}).get("sha") != head:
              raise SystemExit("semantic evidence guard: live PR head moved")

          reviews = get_pages(f"/pulls/{pr_number}/reviews")
          semantic_reviews = [
              review
              for review in reviews
              if review.get("commit_id") == head
              and review.get("state") == "COMMENTED"
              and review.get("user", {}).get("login") in providers
          ]
          review_comments = get_pages(f"/pulls/{pr_number}/comments")
          evidence = []
          for review in semantic_reviews:
              login = review.get("user", {}).get("login")
              body = review.get("body") or ""
              if re.search(r"\bBLOCKING\s*:", body, flags=re.IGNORECASE):
                  raise SystemExit(
                      f"semantic evidence guard: {login} review summary contains BLOCKING finding"
                  )
              findings = [
                  comment
                  for comment in review_comments
                  if int(comment.get("pull_request_review_id") or 0)
                  == int(review.get("id") or 0)
                  and comment.get("user", {}).get("login") == login
                  and (not comment.get("commit_id") or comment.get("commit_id") == head)
              ]
              if findings:
                  raise SystemExit(
                      f"semantic evidence guard: {login} review has {len(findings)} inline finding(s)"
                  )
              evidence.append(f"{login}:review:{review.get('id')}")

          marker = f"<!-- veritas-semantic-codex:v1 head={head} -->"
          issue_comments = get_pages(f"/issues/{pr_number}/comments")
          trusted_triggers = [
              comment
              for comment in issue_comments
              if comment.get("user", {}).get("login") == "github-actions[bot]"
              and marker in (comment.get("body") or "")
          ]
          for trigger in trusted_triggers:
              reactions = get_pages(f"/issues/comments/{trigger.get('id')}/reactions")
              if any(
                  reaction.get("content") == "+1"
                  and reaction.get("user", {}).get("login")
                  == "chatgpt-codex-connector[bot]"
                  for reaction in reactions
              ):
                  evidence.append(
                      f"chatgpt-codex-connector[bot]:reaction:{trigger.get('id')}"
                  )

          if not evidence:
              raise SystemExit(
                  "semantic evidence guard: no clean exact-head Copilot or Codex evidence"
              )
          print(
              "semantic evidence guard pass: "
              f"head={head} evidence={','.join(evidence)}"
          )
          PY

  node-dependency-audit:
    name: Node dependency audit
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit critical vulnerabilities
        run: pnpm audit --audit-level=critical
      - name: Require independent exact-head review
        # One-time migration bootstraps for reviewer-authority PRs #331, #332, and #334 only.
        # PR numbers are unique, so these exceptions are permanently inert after merge.
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.number != 331 &&
          github.event.pull_request.number != 332 &&
          github.event.pull_request.number != 334
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/review_provenance.py check \
            --repository "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --head "$HEAD_SHA"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
