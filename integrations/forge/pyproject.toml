[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-temporal-data"
version = "0.1.0"
description = "Standalone evidence-preserving chronological data release toolkit"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
forge-temporal = "forge_data.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
