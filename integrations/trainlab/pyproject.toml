[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainlab-local"
version = "0.3.0"
description = "Local reproducible experiment runner and comparison dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
server = ["waitress>=3.0.2,<4"]
training = ["torch>=2.5,<3", "numpy>=1.24,<3", "tokenizers>=0.21,<1", "forge-temporal-data>=0.2,<0.3", "investigation-world>=0.11,<0.12", "huggingface_hub>=0.34,<2", "pyarrow>=18,<24", "pyahocorasick>=2.1,<3", "httpx[socks]>=0.28,<1"]

[project.scripts]
trainlab = "trainlab.__main__:main"

[project.urls]
Source = "https://github.com/FPC-effortless/veritas/tree/main/integrations/trainlab"
Issues = "https://github.com/FPC-effortless/veritas/issues"

[tool.setuptools.package-data]
trainlab = ["static/*"]
"trainlab.fullcycle" = ["chat.html"]
