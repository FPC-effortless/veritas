[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainlab-local"
version = "0.1.0"
description = "Local reproducible experiment runner and comparison dashboard"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
trainlab = "trainlab.__main__:main"

[tool.setuptools.package-data]
trainlab = ["static/*"]
