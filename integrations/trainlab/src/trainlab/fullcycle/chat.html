<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrainLab · Model chat</title>
<style>body{font:16px/1.6 system-ui;background:#f5f4f0;color:#252923;margin:0}main{max-width:780px;margin:50px auto;padding:24px}h1{font-size:36px;letter-spacing:-1px;margin:8px 0}small{color:#65705e;letter-spacing:2px}p{color:#596454}.bubble{white-space:pre-wrap;padding:18px 22px;border:1px solid #d9ddcf;border-radius:15px;margin:16px 0;background:white}.user{background:#e8efdf}label{display:block;font-weight:600}textarea{width:100%;box-sizing:border-box;padding:16px;margin:10px 0;border:1px solid #aeb9a4;border-radius:10px;font:inherit;background:white}button{border:0;border-radius:10px;background:#345539;color:white;padding:13px 22px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#reset{background:#e2e7db;color:#345539;margin-left:12px}footer{font-size:13px;color:#687160;margin-top:25px}</style>
<main><small>FORGE / TRAINLAB / VERITAS</small><h1>Your trained model</h1><p>Chat with the exported checkpoint. This small research model has limited training.</p><div id="chat" aria-live="polite"></div><form id="form"><label for="prompt">Message</label><textarea id="prompt" rows="3" required placeholder="What does Forge do?"></textarea><button id="send">Send message</button><button id="reset" type="button">New conversation</button></form><footer>Generation runs locally. Tool calls are displayed as text. No tools execute.</footer></main>
<script>
const csrf='CSRF_TOKEN_PLACEHOLDER',messages=[],chat=document.querySelector('#chat'),send=document.querySelector('#send');
function bubble(text,role){const e=document.createElement('div');e.className='bubble '+role;e.textContent=text;chat.appendChild(e);return e}
document.querySelector('#reset').onclick=()=>{messages.length=0;chat.replaceChildren()};
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#prompt'),text=input.value.trim();if(!text)return;messages.push({role:'user',content:text});bubble(text,'user');input.value='';send.disabled=true;const answer=bubble('…','assistant');let result='';try{const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Chat-Token':csrf},body:JSON.stringify({messages})});if(!response.ok)throw Error('Request failed: '+response.status);const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let end;while((end=buffer.indexOf('\n\n'))>=0){const frame=buffer.slice(0,end);buffer=buffer.slice(end+2);if(!frame.startsWith('data: '))continue;const data=JSON.parse(frame.slice(6));if(data.error)throw Error(data.error);if(data.text!==undefined){result=data.text;answer.textContent=result}}}messages.push({role:'assistant',content:result});if(!result)answer.textContent='The model ended its response.'}catch(err){answer.textContent=err.message}finally{send.disabled=false;input.focus()}};
</script></html>
