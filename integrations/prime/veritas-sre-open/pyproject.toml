[project]
name = "veritas-sre-open"
version = "0.11.0"
description = "Public synthetic Prime Verifiers environment demonstrating Veritas SRE causal-class evaluation semantics"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["verifiers>=0.2,<0.3"]
keywords = ["evaluation", "agents", "sre", "incident-response", "verifiers", "reasoning"]

[project.urls]
Repository = "https://github.com/FPC-effortless/veritas"
Release = "https://github.com/FPC-effortless/veritas/releases/tag/v0.11.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veritas_sre_open"]

[tool.verifiers.eval]
num_examples = 12
rollouts_per_example = 1
